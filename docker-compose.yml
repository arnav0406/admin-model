version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres-db:
    image: postgres:16-alpine
    container_name: doc_cms_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-arnav}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arnavsr}
      POSTGRES_DB: ${DB_NAME:-userdir}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Automatically run initial SQL schema setup on first container startup
      - ./setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro

  # 2. Node.js Backend API Service
  backend:
    build: .
    container_name: doc_cms_backend
    restart: always
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      DB_HOST: postgres-db
      DB_USER: ${DB_USER:-arnav}
      DB_PASSWORD: ${DB_PASSWORD:-arnavsr}
      DB_NAME: ${DB_NAME:-userdir}
      DB_PORT: 5432
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456}
      UPLOADS_PATH: /usr/src/app/uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5175}
    depends_on:
      - postgres-db
    volumes:
      - ./uploads:/usr/src/app/uploads

volumes:
  pgdata:
